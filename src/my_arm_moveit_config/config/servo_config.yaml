###############################################
# MoveIt Servo configuration (Jazzy, moveit_servo 2.12)
# Loaded under the 'moveit_servo' namespace by demo_joystick.launch.py.
# Parameter reference: /opt/ros/jazzy/share/moveit_servo/config/servo_parameters.yaml
###############################################

# SRDF group: chain link_1 -> ee_link (shoulder + elbow; base and wrist are not in it).
# In this version there are no ee_frame / planning_frame parameters: they come from
# this group.
move_group_name: arm

# --- INPUT ---
# arm_teleop (my_arm_description) solves the 2-link IK itself and sends shoulder/elbow
# speeds as JointJog commands in rad/s (Servo is switched to JOINT_JOG mode at launch).
# Cartesian twist mode is not used: with only 2 joints, Servo's 6-D solve cannot follow
# a planar x/z command.
command_in_type: "speed_units"
scale:
  linear: 0.08      # only used by twist/pose commands (not used here)
  rotational: 0.2   # only used by twist/pose commands (not used here)
  joint: 0.5        # only used by unitless joint commands (not used here)

cartesian_command_in_topic: ~/delta_twist_cmds   # -> /servo_node/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
status_topic: ~/status

# --- SAFETY & TIMING ---
# Commands older than this are discarded and the arm halts. arm_teleop only publishes
# while the deadman is held, so the arm stops within this time if anything goes quiet.
incoming_command_timeout: 0.1
publish_period: 0.01          # 100 Hz, same as the controller manager
max_expected_latency: 0.1
joint_limit_margins: [0.05]   # rad kept clear of each joint limit

# --- OUTPUT ---
command_out_topic: /arm_controller/joint_trajectory
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
joint_topic: /joint_states

# --- SMOOTHING ---
use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# --- COLLISION CHECKING ---
check_collisions: false
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02

# --- SINGULARITIES ---
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
