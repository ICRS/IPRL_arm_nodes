teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1  # Left Stick Vertical -> Forward/Back
      y: 0  # Left Stick Horizontal -> Left/Right
      z: 4  # Right Stick Vertical -> Up/Down
    axis_angular:
      yaw: 3 # Right Stick Horizontal -> Rotate
    scale_linear:
      x: 1.0
      y: 1.0
      z: 1.0
    scale_angular:
      yaw: 1.0
    # Deadman switch (Safety). You MUST hold this button to move.
    # Button 5 is usually Right Bumper (RB) on Xbox.
    require_enable_button: true
    enable_button: 5
    enable_turbo_button: -1