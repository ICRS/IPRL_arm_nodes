# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# arm_controller:
#   ros__parameters:
#     joints:
#       - joint_1
#       - joint_2
#       - joint_3
#       - joint_4
#     command_interfaces:
#       - position
#     state_interfaces:
#       - position

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    
    # CRITICAL FIX 1: Allow moving just one joint (or a subset) without error
    allow_partial_joints_goal: true 
    
    # CRITICAL FIX 2: Relax timing constraints so Servo commands aren't dropped
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.05